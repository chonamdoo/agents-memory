name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Full collection or explicitly selected changed-path regressions
        type: choice
        options: [full, changes]
        default: full
        required: true
      test_paths_json:
        description: JSON array of directly affected test paths or node selectors
        type: string
      lint_paths_json:
        description: JSON array of changed Python files
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UV_NO_PROGRESS: '1'
  CI_SCOPE_TEST_PATHS: ${{ inputs.test_paths_json }}
  CI_SCOPE_LINT_PATHS: ${{ inputs.lint_paths_json }}

jobs:
  tests:
    name: Tests (${{ matrix.index }}/${{ inputs.verification_scope == 'changes' && '1' || '4' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(inputs.verification_scope == 'changes' && '[0]' || '[0,1,2,3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false
      - name: Check exact head
        run: test "$(git rev-parse HEAD)" = "$CI_TESTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Prepare owned prerequisites
        run: python3 .github/ci/environment.py prepare --state-dir "$RUNNER_TEMP/agents-memory-ci" --postgres
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Run complete collection partition
        if: inputs.verification_scope != 'changes'
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: timeout --signal=TERM --kill-after=15s 600s uv run python .github/ci/run-tests.py --index "$SHARD_INDEX" --count 4 --result-dir .ci-results
      - name: Run only directly affected source regressions
        if: inputs.verification_scope == 'changes'
        run: >-
          timeout --signal=TERM --kill-after=15s 600s uv run python .github/ci/run-tests.py
          --index 0 --count 1 --result-dir .ci-results --test-paths-json "$CI_SCOPE_TEST_PATHS"
      - name: Exercise source health API and CLI
        if: matrix.index == 0 && inputs.verification_scope != 'changes'
        run: uv run --no-sync python .github/ci/run-evaluation.py health-source --result-dir .ci-results
      - name: Exercise only changed real health consumers
        if: always() && inputs.verification_scope == 'changes'
        run: uv run --no-sync python .github/ci/run-evaluation.py health-source --changes-only --result-dir .ci-results
      - name: Clean owned prerequisites
        if: always()
        run: python3 .github/ci/environment.py cleanup --state-dir "$RUNNER_TEMP/agents-memory-ci"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-tests-${{ matrix.index }}
          include-hidden-files: true
          path: |
            .ci-results/shard.json
            .ci-results/prerequisites.json
            .ci-results/junit.xml
            .ci-results/health-source.json
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false
      - name: Check exact head
        run: test "$(git rev-parse HEAD)" = "$CI_TESTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Prepare owned prerequisites
        run: python3 .github/ci/environment.py prepare --state-dir "$RUNNER_TEMP/agents-memory-ci" --postgres
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Run bounded lint and build
        if: inputs.verification_scope != 'changes'
        run: uv run python .github/ci/run-checks.py --result-dir .ci-results
      - name: Check changed Python files and exact installed consumers
        if: inputs.verification_scope == 'changes'
        run: >-
          uv run python .github/ci/run-checks.py --result-dir .ci-results
          --test-paths-json "$CI_SCOPE_TEST_PATHS" --lint-paths-json "$CI_SCOPE_LINT_PATHS"
      - name: Exercise exact installed-wheel health API and CLI
        if: inputs.verification_scope != 'changes'
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I .github/ci/wheel-consumer.py \
            --installed-wheel "$GITHUB_WORKSPACE"/dist/*.whl --health-only --result-dir .ci-results
      - name: Exercise only changed exact installed-wheel health consumers
        if: always() && inputs.verification_scope == 'changes'
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I .github/ci/wheel-consumer.py \
            --installed-wheel "$GITHUB_WORKSPACE"/dist/*.whl --health-changes-only --result-dir .ci-results
      - name: Clean owned prerequisites
        if: always()
        run: python3 .github/ci/environment.py cleanup --state-dir "$RUNNER_TEMP/agents-memory-ci"
      - name: Preserve lint/build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-checks
          include-hidden-files: true
          path: |
            .ci-results/checks.json
            .ci-results/comment-check.json
            .ci-results/prerequisites.json
            .ci-results/wheel-consumer.json
            .ci-results/wheel-consumer-junit.xml
            .ci-results/health-installed.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve public distribution
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  compatibility:
    if: inputs.verification_scope != 'changes'
    name: Ownership compatibility (macOS Python 3.12)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false
      - name: Check exact head
        run: test "$(git rev-parse HEAD)" = "$CI_TESTED_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install frozen minimum-version dependencies
        run: uv sync --frozen --python 3.12.13
      - name: Run owned process compatibility regressions
        timeout-minutes: 5
        run: uv run --no-sync --python 3.12.13 python .github/ci/ownership-compat.py --result-dir .ci-results
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-compatibility
          include-hidden-files: true
          path: |
            .ci-results/compatibility.json
            .ci-results/junit.xml
          if-no-files-found: error
          retention-days: 14

  evaluation:
    if: inputs.verification_scope != 'changes'
    name: Real Docker evaluation engineering (installed wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false
      - name: Check exact head
        run: test "$(git rev-parse HEAD)" = "$CI_TESTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Prepare real owned PostgreSQL prerequisites
        run: python3 .github/ci/environment.py prepare --state-dir "$RUNNER_TEMP/agents-memory-ci" --postgres
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Build this job's own exact-source wheel
        run: timeout --signal=TERM --kill-after=15s 300s uv build
      - name: Acquire measure and exercise real evaluation runtime
        run: uv run --no-sync python .github/ci/run-evaluation.py run --result-dir .ci-results
      - name: Always reconcile exact runtime schema processes and prerequisites
        if: always()
        run: |
          status=0
          if test -n "${UV_PROJECT_ENVIRONMENT:-}" && test -x "$UV_PROJECT_ENVIRONMENT/bin/python"; then
            "$UV_PROJECT_ENVIRONMENT/bin/python" -I .github/ci/run-evaluation.py cleanup --result-dir .ci-results || status=1
          else
            status=1
          fi
          if test -d "$RUNNER_TEMP/agents-memory-ci"; then
            python3 .github/ci/environment.py cleanup --state-dir "$RUNNER_TEMP/agents-memory-ci" || status=1
            status=1
          fi
          exit "$status"
      - name: Preserve only body-free evaluation evidence after cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evaluation
          include-hidden-files: true
          path: |
            .ci-results/prerequisites.json
            .ci-results/evaluation-job.json
            .ci-results/evaluation-runtime-prepare.json
            .ci-results/evaluation-scenarios.json
            .ci-results/evaluation-scenarios-junit.xml
            .ci-results/evaluation-smoke.json
            .ci-results/evaluation-runtime-cleanup.json
            .ci-results/evaluation-cleanup.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: ${{ inputs.verification_scope == 'changes' && 'Changed-path CI gate' || 'Complete CI gate' }}
    if: always()
    needs: [tests, checks, compatibility, evaluation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_UPSTREAM_JOBS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false
      - name: Check exact head
        run: test "$(git rev-parse HEAD)" = "$CI_TESTED_SHA"
      - name: Download test evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-tests-*
          path: .ci-artifacts
      - name: Download lint/build evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-checks
          path: .ci-artifacts/ci-checks
      - name: Download compatibility evidence
        if: inputs.verification_scope != 'changes'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-compatibility
          path: .ci-artifacts/ci-compatibility
      - name: Download real evaluation evidence
        if: inputs.verification_scope != 'changes'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-evaluation
          path: .ci-artifacts/ci-evaluation
      - name: Download exercised public distribution
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution
          path: .ci-artifacts/distribution
      - name: Require complete passing evidence
        if: always() && inputs.verification_scope != 'changes'
        run: python3 .github/ci/aggregate.py --artifacts .ci-artifacts --expected-shards 4 --output .ci-results/summary.json
      - name: Require passing evidence for every declared changed-path regression
        if: always() && inputs.verification_scope == 'changes'
        run: >-
          python3 .github/ci/aggregate.py --artifacts .ci-artifacts --expected-shards 1
          --output .ci-results/summary.json --test-paths-json "$CI_SCOPE_TEST_PATHS"
          --lint-paths-json "$CI_SCOPE_LINT_PATHS"
      - name: Preserve aggregate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-summary
          include-hidden-files: true
          path: .ci-results/summary.json
          if-no-files-found: error
          retention-days: 14
