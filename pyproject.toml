[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-mcp"
version = "0.1.0"
description = "Local-first, provenance-aware memory for independent coding agents"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp==2.3.0",
  "asyncpg>=0.31,<1",
  "alembic>=1.17,<2",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
local-models = [
  "sentence-transformers>=5,<6",
  "torch>=2.7,<3",
]

[project.scripts]
agent-memory = "agent_memory_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
